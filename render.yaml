# DropZen production Blueprint. Secrets are generated by Render or set in the
# dashboard — never commit real values here.
# Schema: https://render.com/schema/render.yaml.json

databases:
  - name: dropzen-db
    plan: basic-256mb
    databaseName: dropzen
    user: dropzen
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: dropzen-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    branch: main
    disk:
      name: dropzen-uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dropzen-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "false"
